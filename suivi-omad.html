/* ================= stockage local ================= */

const PREFIX_JOUR = "omad:jour:";
const PREFIX_SPORT = "omad:sport:";
const CLE_CIBLES = "omad:cibles";
const CLE_MESURES = "omad:mesures";
const CLE_API = "omad:api-photo";
const CLE_SECRET_PHOTO = "omad:api-photo-cle";

function lireJSON(cle, defaut) {
  try {
    const brut = localStorage.getItem(cle);
    if (!brut) return defaut;
    const val = JSON.parse(brut);
    return val == null ? defaut : val;
  } catch (e) {
    console.warn("Lecture impossible pour", cle, e);
    return defaut;
  }
}

function ecrireJSON(cle, valeur) {
  try {
    localStorage.setItem(cle, JSON.stringify(valeur));
    return true;
  } catch (e) {
    console.warn("Écriture impossible pour", cle, e);
    montrerToast("Stockage plein ou indisponible — la sauvegarde a échoué.");
    return false;
  }
}

function getEntrees(date) { return lireJSON(PREFIX_JOUR + date, []); }
function setEntrees(date, liste) { ecrireJSON(PREFIX_JOUR + date, liste); }
function getSport(date) { return lireJSON(PREFIX_SPORT + date, {}); }
function setSport(date, obj) { ecrireJSON(PREFIX_SPORT + date, obj); }
function getCibles() {
  const c = lireJSON(CLE_CIBLES, null);
  if (!c || typeof c !== "object") return { ...CIBLES };
  return { kcal: Number(c.kcal) || CIBLES.kcal, prot: Number(c.prot) || CIBLES.prot,
    lip: Number(c.lip) || CIBLES.lip, gluc: Number(c.gluc) || CIBLES.gluc, fib: Number(c.fib) || CIBLES.fib };
}
function setCibles(c) { ecrireJSON(CLE_CIBLES, c); }
function getMesures() { const m = lireJSON(CLE_MESURES, []); return Array.isArray(m) ? m : []; }
function setMesures(liste) { ecrireJSON(CLE_MESURES, liste); }
function getApiPhoto() { return lireJSON(CLE_API, ""); }
function setApiPhoto(url) { ecrireJSON(CLE_API, url); }
function getCleSecretePhoto() { return lireJSON(CLE_SECRET_PHOTO, ""); }
function setCleSecretePhoto(cle) { ecrireJSON(CLE_SECRET_PHOTO, cle); }

function dateMoins(iso, jours) {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() - jours);
  return d.toISOString().slice(0, 10);
}

function exporterSauvegarde() {
  const out = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const cle = localStorage.key(i);
      if (cle && cle.indexOf("omad:") === 0) out[cle] = localStorage.getItem(cle);
    }
  } catch (e) { console.warn("Export impossible :", e); }
  return { version: 1, exporte_le: aujourdhui(), donnees: out };
}

function importerSauvegarde(objet) {
  if (!objet || typeof objet !== "object" || !objet.donnees) throw new Error("Fichier de sauvegarde invalide.");
  let n = 0;
  for (const [cle, valeur] of Object.entries(objet.donnees)) {
    if (cle.indexOf("omad:") !== 0) continue;
    try { localStorage.setItem(cle, valeur); n++; } catch (e) { console.warn("Import: échec sur", cle, e); }
  }
  return n;
}

function toutesLesDatesAvecJournee() {
  const dates = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const cle = localStorage.key(i);
      if (cle && cle.indexOf(PREFIX_JOUR) === 0) {
        const d = cle.slice(PREFIX_JOUR.length);
        const liste = lireJSON(cle, []);
        if (Array.isArray(liste) && liste.length > 0) dates.push(d);
      }
    }
  } catch (e) {
    console.warn("Stockage local indisponible :", e);
  }
  dates.sort().reverse();
  return dates;
}

/* ================= utilitaires ================= */

const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

function aujourdhui() { return new Date().toISOString().slice(0, 10); }

function formatDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`;
}
function formatDateCourt(iso) {
  const d = new Date(iso + "T12:00:00");
  return `${d.getDate()} ${MOIS[d.getMonth()]}`;
}

function total(entrees, cle) {
  return Math.round(entrees.reduce((s, e) => s + (Number(e[cle]) || 0), 0));
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function arrondi1(n) { return Math.round((Number(n) || 0) * 10) / 10; }

function normaliser(s) {
  return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/* Notes sur 100 avec code couleur : vert ≥ 70, orange 40-69, rouge < 40. */
function couleurNote(n) {
  const v = Number(n) || 0;
  if (v >= 70) return "var(--pistache)";
  if (v >= 40) return "var(--abricot)";
  return "var(--brique)";
}

function pastilleNote(label, n) {
  const c = couleurNote(n);
  return `<span class="note-pill" style="color:${c};border-color:${c}">${label}<b>${Math.round(Number(n) || 0)}</b></span>`;
}

function pastillesAliment(a) {
  if (a == null || a.satiete == null) return "";
  return `<span class="note-row">${pastilleNote("Satiété ", a.satiete)}${pastilleNote("Qualité ", a.qualite)}</span>`;
}

function libelleNote(n) {
  const v = Number(n) || 0;
  if (v >= 85) return "excellent";
  if (v >= 70) return "bon";
  if (v >= 55) return "correct";
  if (v >= 40) return "moyen";
  if (v >= 25) return "faible";
  return "très faible";
}

/* Calcule les grammes de chaque aliment sélectionné pour approcher le budget restant.
   Heuristique simple, pas une optimisation exacte : légumes/fruits en portion fixe,
   protéines réparties selon le déficit protéique, féculents comblent le reste des calories. */
function calculerComposition(noms, restant) {
  const items = noms.map((n) => BASE_ALIMENTS.find((a) => a.nom === n)).filter(Boolean);
  const parRole = (role) => items.filter((a) => a.role === role);
  const resultats = [];
  let kcalRestant = restant.kcal;
  let protRestant = restant.prot;

  const ajouter = (aliment, grammes) => {
    grammes = Math.max(10, Math.round(grammes / 10) * 10);
    resultats.push({ aliment, grammes });
    kcalRestant -= (aliment.kcal * grammes) / aliment.gramme;
    protRestant -= (aliment.prot * grammes) / aliment.gramme;
  };

  parRole("legume").forEach((a) => ajouter(a, 150));
  parRole("fruit").forEach((a) => ajouter(a, 120));

  const proteines = parRole("proteine").filter((a) => a.gramme > 0 && a.prot > 0);
  if (proteines.length) {
    const besoin = Math.max(protRestant, 20);
    const densiteTotale = proteines.reduce((s, a) => s + a.prot / a.gramme, 0) || 1;
    proteines.forEach((a) => {
      const part = besoin * ((a.prot / a.gramme) / densiteTotale);
      const g = Math.max(40, Math.min(350, part / (a.prot / a.gramme)));
      ajouter(a, g);
    });
  }
  parRole("proteine").filter((a) => a.prot === 0).forEach((a) => ajouter(a, a.gramme));

  parRole("gras").forEach((a) => ajouter(a, Math.min(30, a.gramme * 2)));

  const feculents = parRole("feculent");
  if (feculents.length) {
    const kcalDispo = Math.max(kcalRestant, 0);
    const densiteTotale = feculents.reduce((s, a) => s + a.kcal / a.gramme, 0) || 1;
    feculents.forEach((a) => {
      const part = kcalDispo * ((a.kcal / a.gramme) / densiteTotale);
      const g = Math.max(30, Math.min(400, part / (a.kcal / a.gramme)));
      ajouter(a, g);
    });
  }

  parRole("autre").forEach((a) => ajouter(a, Math.min(a.gramme * 2, 100)));

  let kcalFinalTotal = 0;
  let protFinalTotal = 0;
  resultats.forEach((r) => {
    kcalFinalTotal += (r.aliment.kcal * r.grammes) / r.aliment.gramme;
    protFinalTotal += (r.aliment.prot * r.grammes) / r.aliment.gramme;
  });

  let suggestion = null;
  if (protRestant > 15) {
    const dejaChoisis = new Set(items.map((a) => a.nom));
    const candidat = BASE_ALIMENTS
      .filter((a) => a.role === "proteine" && a.prot > 0 && !dejaChoisis.has(a.nom))
      .sort((a, b) => b.prot / b.gramme - a.prot / a.gramme)[0];
    if (candidat) {
      const gSugg = Math.max(30, Math.round((protRestant / (candidat.prot / candidat.gramme)) / 10) * 10);
      suggestion = {
        aliment: candidat, grammes: gSugg,
        raison: `Il manque encore environ ${Math.round(protRestant)} g de protéines — pense à ${candidat.nom.toLowerCase()} (≈${gSugg} g apporterait ce qu'il faut).`,
      };
    }
  }

  return { resultats, kcalFinalTotal, protFinalTotal, suggestion };
}

let toastTimer = null;
function montrerToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2200);
}

/* ---------- onglet journée ---------- */

function renderJour(t) {
  const reste = state.cibles.kcal - t.kcal;
  const depasse = reste < 0;

  const rail = state.entrees.map((e, i) => `
    <div class="seg" style="width:${Math.min(100, ((Number(e.kcal) || 0) / state.cibles.kcal) * 100)}%;
      background:${COULEURS[i % COULEURS.length]}; opacity:.9" title="${esc(e.nom)}"></div>
  `).join("");

  const hier = dateMoins(state.date, 1);
  const entreesHier = getEntrees(hier);
  const dupliquer = state.entrees.length === 0 && entreesHier.length > 0
    ? `<button class="btn btn-ghost" id="btn-dupliquer-hier" style="width:100%;margin-bottom:14px">
        Reprendre les ${entreesHier.length} entrée${entreesHier.length > 1 ? "s" : ""} d'hier (${total(entreesHier, "kcal")} kcal)
      </button>`
    : "";

  const macro = (label, val, cible, couleur) => `
    <div class="macro">
      <div class="macro-lab">${label}</div>
      <div class="macro-val" style="color:${couleur}">${val}<small> / ${cible} g</small></div>
      <div class="macro-bar"><div class="macro-fill" style="width:${Math.min(100, (val / cible) * 100)}%; background:${couleur}"></div></div>
    </div>`;

  const listeEntrees = state.entrees.length === 0
    ? `<div class="vide">Rien d'enregistré pour l'instant.<br>Ajoute ton premier aliment ci-dessus, ou pioche dans tes habituels.</div>`
    : `<div style="margin-top:4px">${state.entrees.map((e, i) => `
        <div class="entree">
          <div style="width:4px;height:34px;border-radius:2px;flex-shrink:0;background:${COULEURS[i % COULEURS.length]}"></div>
          <div style="flex:1;min-width:0">
            <div class="entree-nom">${esc(e.nom)}</div>
            <div class="entree-det">${e.prot ?? 0} P · ${e.lip ?? 0} L · ${e.gluc ?? 0} G${e.quantite ? " · " + esc(e.quantite) : ""}</div>
            ${e.satiete != null ? `<div class="entree-badge">${pastillesAliment(e)}</div>` : ""}
          </div>
          <div class="entree-kcal">${e.kcal}</div>
          <button class="suppr" data-retirer="${e.id}" aria-label="Retirer ${esc(e.nom)}">×</button>
        </div>
      `).join("")}</div>`;

  const j = state.date === aujourdhui() ? texteJeune() : null;
  const carteJeune = j ? `
    <div class="jeune-card">
      <div class="jeune-haut">
        <div>
          <div class="eyebrow" style="margin-bottom:4px">${esc(j.etat)}</div>
          <div class="jeune-duree" id="jeune-duree" style="color:${j.couleur}">${j.duree}</div>
        </div>
        <div class="jeune-lab">depuis<br>ton dernier<br>aliment</div>
      </div>
      <div class="macro-bar" style="margin-top:10px"><div class="macro-fill" style="width:${j.pct}%;background:${j.couleur}"></div></div>
    </div>` : "";

  return `
    ${carteJeune}
    ${dupliquer}
    <div class="jauge-card">
      <div class="jauge-top">
        <div>
          <div class="eyebrow">Calories</div>
          <div class="jauge-kcal">${t.kcal}</div>
        </div>
        <div class="jauge-cible">/ ${state.cibles.kcal} kcal</div>
      </div>
      <div class="rail">${rail}</div>
      <div class="jauge-reste">
        ${depasse
          ? `Tu es à <b>${Math.abs(reste)} kcal</b> au-dessus. Sans importance sur la semaine.`
          : `Il te reste <b>${reste} kcal</b> à caler.`}
      </div>
    </div>

    <div class="macros">
      ${macro("Protéines", t.prot, state.cibles.prot, "#A9C85B")}
      ${macro("Lipides", t.lip, state.cibles.lip, "#F0A05A")}
      ${macro("Glucides", t.gluc, state.cibles.gluc, "#C58BD1")}
      ${macro("Fibres", t.fib, state.cibles.fib, "#6FB6C9")}
    </div>

    ${renderPanneauAjout()}
    ${listeEntrees}
  `;
}

            <label class="champ-lab">Lipides (g)</label>

          </div>
        </div>
        <div class="grille2" style="margin-bottom:12px">
          <div>
            <label class="champ-lab">Glucides (g)</label>
            <input class="champ champ-num" id="c-gluc" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${choix ? arrondi1(choix.gluc * ratio) : ""}" />

    if (!apiConfig) {

function renderComposerTab() {
  const t = { kcal: total(state.entrees, "kcal"), prot: total(state.entrees, "prot") };
  const restant = { kcal: Math.max(0, state.cibles.kcal - t.kcal), prot: Math.max(0, state.cibles.prot - t.prot) };

  const q = normaliser(state.rechercheComposer.trim());
  const suggestions = q.length >= 2
    ? BASE_ALIMENTS.filter((a) => normaliser(a.nom).includes(q) && !state.composerSelection.includes(a.nom)).slice(0, 6)
    : [];

  const groupes = [
    ["proteine", "Protéines"], ["feculent", "Féculents"], ["legume", "Légumes"], ["fruit", "Fruits"], ["gras", "Matières grasses"],
  ];
  const courants = groupes.map(([role, label]) => {
    const items = BASE_ALIMENTS.filter((a) => a.role === role && a.courant);
    if (!items.length) return "";
    return `
      <div class="composer-groupe">
        <div class="composer-groupe-titre">${label}</div>
        <div class="composer-puces">
          ${items.map((a) => `
            <button type="button" class="puce-aliment ${state.composerSelection.includes(a.nom) ? "on" : ""}" data-composer-toggle="${esc(a.nom)}">${esc(a.nom)}</button>
          `).join("")}
        </div>
      </div>`;
  }).join("");

  const horsCourants = state.composerSelection.filter(
    (n) => { const a = BASE_ALIMENTS.find((x) => x.nom === n); return a && !a.courant; }
  );
  const selectionSupp = horsCourants.length ? `
    <div class="composer-groupe">
      <div class="composer-groupe-titre">Ajoutés par recherche</div>
      <div class="composer-puces">
        ${horsCourants.map((n) => `<button type="button" class="puce-aliment on" data-composer-toggle="${esc(n)}">${esc(n)} ×</button>`).join("")}
      </div>
    </div>` : "";

  const resultat = state.composerResultat;

  return `
    <div class="aide" style="margin-top:0;margin-bottom:12px">Il te reste <b style="color:var(--craie)">${restant.kcal} kcal</b> et <b style="color:var(--craie)">${restant.prot} g de protéines</b> à caler. Sélectionne ce que tu as sous la main, l'appli calcule les quantités.</div>
    <input class="champ" id="champ-recherche-composer" type="search" placeholder="Chercher un autre aliment…"
      value="${esc(state.rechercheComposer)}" autocomplete="off" style="margin-bottom:8px" />
    ${suggestions.length ? `<div class="resultats-liste" style="margin-bottom:12px">${suggestions.map((a) => `
      <button type="button" class="resultat-aliment" data-composer-ajouter="${esc(a.nom)}">
        <span>${esc(a.nom)}</span>
        <span class="resultat-badge" style="color:${couleurNote(a.satiete)}">Sat. ${a.satiete}</span>
      </button>`).join("")}</div>` : ""}
    ${selectionSupp}
    ${courants}
    <button class="btn btn-primaire" id="btn-calculer-composition" style="margin-top:12px" ${state.composerSelection.length === 0 ? "disabled" : ""}>Calculer les quantités</button>
    ${resultat ? `
      <div class="composer-resultat">
        ${resultat.resultats.map((r) => `
          <div class="entree">
            <div style="flex:1">
              <div class="entree-nom">${esc(r.aliment.nom)}</div>
              <div class="entree-det">${r.grammes} g · ${Math.round((r.aliment.kcal * r.grammes) / r.aliment.gramme)} kcal</div>
            </div>
          </div>
        `).join("")}
        <div class="aide">Total estimé : ${Math.round(resultat.kcalFinalTotal)} kcal · ${Math.round(resultat.protFinalTotal)} g de protéines</div>
        ${resultat.suggestion ? `<div class="erreur" style="border-color:var(--abricot);background:rgba(240,160,90,.14)">${esc(resultat.suggestion.raison)}</div>` : ""}

      </div>
    ` : ""}
  `;
}

/* ---------- onglet sport ---------- */

function renderSport() {
  const disponibles = Object.entries(PROGRAMMES).filter(
    ([, v]) => v.lieu === state.lieuSport && v.niveau === state.niveauSport
  );

  if (disponibles.length === 0) {
    return `
      ${renderSportFiltres([])}
      <div class="vide">Aucun programme pour cette combinaison.<br>Change de lieu ou de niveau ci-dessus.</div>`;
  }

  const cleSeance = disponibles.some(([k]) => k === state.seanceChoisie)
    ? state.seanceChoisie
    : disponibles[0][0];
  const s = PROGRAMMES[cleSeance];
  const nbFaits = s.exos.filter((_, i) => state.sportFait[`${cleSeance}-${i}`]).length;
  const pct = Math.round((nbFaits / s.exos.length) * 100);

  const exos = s.exos.map((e, i) => {
    const cle = `${cleSeance}-${i}`;
    const ok = !!state.sportFait[cle];
    const ouvert = state.exoDetailOuvert === cle;
    return `
      <div class="exo ${ok ? "fait" : ""}">
        <div class="coche" data-exo="${cle}" role="checkbox" aria-checked="${ok}" tabindex="0" aria-label="Marquer ${esc(e.nom)} comme fait">${ok ? "✓" : ""}</div>
        <div style="flex:1;min-width:0">
          <div class="exo-nom">${esc(e.nom)}</div>
          <div class="exo-ligne-meta">
            <span class="exo-series">${esc(e.series)}</span>
            ${e.repos && e.repos !== "—" ? `<span class="exo-repos">⏱ ${esc(e.repos)}</span>` : ""}
          </div>
          <div class="exo-muscles">${esc(e.muscles)}</div>
        </div>
        <button class="exo-info" data-exo-info="${cle}" aria-label="Détails de ${esc(e.nom)}">${ouvert ? "▲" : "▼"}</button>
      </div>
      ${ouvert ? `
        <div class="exo-detail">
          <a class="btn-video" href="${lienVideo(e.video)}" target="_blank" rel="noopener noreferrer">▶ Voir la démo vidéo</a>
          <div class="exo-bloc">
            <div class="exo-bloc-titre">Comment faire</div>
            <div class="exo-bloc-txt">${esc(e.note)}</div>
          </div>
          <div class="exo-bloc exo-bloc-alerte">
            <div class="exo-bloc-titre">⚠️ Erreur fréquente</div>
            <div class="exo-bloc-txt">${esc(e.erreur)}</div>
          </div>
        </div>` : ""}
    `;
  }).join("");

  return `
    ${renderSportFiltres(disponibles, cleSeance)}
    <div class="jauge-card" style="padding:16px">
      <div class="eyebrow">${esc(s.duree)} · ${s.lieu === "salle" ? "salle de sport" : "sans matériel"}</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">
        <span class="num" style="font-size:28px">${nbFaits}</span>
        <span style="color:#A99BB2;font-size:14px">/ ${s.exos.length} exercices faits</span>
      </div>
      <div class="macro-bar" style="margin-top:10px"><div class="macro-fill" style="width:${pct}%;background:var(--pistache)"></div></div>
      <div class="aide" style="margin-top:10px">${esc(s.intro)}</div>

/* ---------- onglet aliments ---------- */

function alimentsFiltres() {
  const q = normaliser(state.rechercheAliments.trim());
  let liste = BASE_ALIMENTS;
  if (state.categorieAliments !== "tout") {
    liste = liste.filter((a) => a.categorie === state.categorieAliments);
  }
  if (q.length >= 2) {
    liste = BASE_ALIMENTS.filter((a) => normaliser(a.nom).includes(q));
  }
  const tri = state.triAliments;
  const copie = [...liste];
  if (tri === "satiete") copie.sort((a, b) => b.satiete - a.satiete);
  else if (tri === "qualite") copie.sort((a, b) => b.qualite - a.qualite);
  else if (tri === "proteines") copie.sort((a, b) => (b.prot / b.gramme) - (a.prot / a.gramme));
  else if (tri === "legeres") copie.sort((a, b) => (a.kcal / a.gramme) - (b.kcal / b.gramme));
  return copie;
}

/* ---------- onglet historique ---------- */

function renderHistorique() {
  const dates = toutesLesDatesAvecJournee();

  if (dates.length === 0) {
    return `<div class="vide">Pas encore d'historique.<br>Ajoute des aliments dans l'onglet Journée : chaque jour rempli apparaîtra ici.</div>`;
  }

  const limite = dates.slice(0, 30);
  const septDerniers = dates.filter((d) => {
    const diff = (new Date(aujourdhui() + "T00:00:00") - new Date(d + "T00:00:00")) / 86400000;
    return diff >= 0 && diff < 7;
  });
  const moyenneKcal7j = septDerniers.length
    ? Math.round(septDerniers.reduce((s, d) => s + total(getEntrees(d), "kcal"), 0) / septDerniers.length)
    : 0;
  const moyenneProt7j = septDerniers.length
    ? Math.round(septDerniers.reduce((s, d) => s + total(getEntrees(d), "prot"), 0) / septDerniers.length)
    : 0;

  const couleurPour = (kcal) => {
    if (kcal === 0) return "#3D3050";
    const ratio = kcal / state.cibles.kcal;
    if (ratio <= 1.05) return "var(--pistache)";
    if (ratio <= 1.2) return "var(--abricot)";
    return "var(--brique)";
  };

  const lignes = limite.map((d) => {
    const entrees = getEntrees(d);
    const kcal = total(entrees, "kcal");
    const prot = total(entrees, "prot");
    const pct = Math.min(100, (kcal / state.cibles.kcal) * 100);
    const dd = new Date(d + "T12:00:00");
    return `
      <div class="histo-jour" data-histo-date="${d}">
        <div class="histo-date">
          <div class="j">${JOURS[dd.getDay()].slice(0, 3)}.</div>
          <div class="d">${formatDateCourt(d)}</div>
        </div>
        <div class="histo-barre-zone">
          <div class="histo-barre"><div class="histo-barre-fill" style="width:${pct}%; background:${couleurPour(kcal)}"></div></div>
          <div class="histo-detail">${prot} g prot · ${entrees.length} entrée${entrees.length > 1 ? "s" : ""}</div>
        </div>
        <div class="histo-kcal">${kcal}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="histo-resume">
      <div class="histo-stat"><div class="v">${dates.length}</div><div class="l">Jours suivis</div></div>
      <div class="histo-stat"><div class="v">${moyenneKcal7j}</div><div class="l">Kcal moy. 7j</div></div>
      <div class="histo-stat"><div class="v">${moyenneProt7j} g</div><div class="l">Prot. moy. 7j</div></div>
    </div>
    <div class="legende">
      <div class="legende-item"><span class="legende-puce" style="background:var(--pistache)"></span>Dans la cible</div>
      <div class="legende-item"><span class="legende-puce" style="background:var(--abricot)"></span>Léger dépassement</div>
      <div class="legende-item"><span class="legende-puce" style="background:var(--brique)"></span>Bien au-dessus</div>
    </div>
    ${lignes}
    ${dates.length > 30 ? `<div class="vide">Les 30 jours les plus récents sont affichés.</div>` : ""}
  `;
}

/* ================= événements ================= */

function attacherEvenements() {
  root.querySelectorAll("[data-tab]").forEach((btn) => {
    btn.addEventListener("click", () => { state.tab = btn.dataset.tab; render(); });
  });

  const champDate = document.getElementById("champ-date");
  if (champDate) {
    champDate.addEventListener("change", () => {
      if (champDate.value) { state.date = champDate.value; chargerJour(); render(); }
    });
  }

  root.querySelectorAll("[data-retirer]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.retirer;
      state.entrees = state.entrees.filter((e) => String(e.id) !== String(id));
      setEntrees(state.date, state.entrees);
      render();
    });
  });

  root.querySelectorAll("[data-mode-ajout]").forEach((btn) => {
    btn.addEventListener("click", () => { state.modeAjout = btn.dataset.modeAjout; render(); });
  });

  root.querySelectorAll("[data-favori]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const f = BASE_ALIMENTS.find((x) => x.nom === btn.dataset.favori);
      if (!f) return;
      ajouterEntree({
        nom: f.nom, quantite: f.unite, kcal: f.kcal, prot: f.prot, lip: f.lip, gluc: f.gluc, fib: f.fib,
        qualite: f.qualite, satiete: f.satiete,
      });
      montrerToast(`${f.nom} ajouté`);
    });
  });

  const champRecherche = document.getElementById("c-recherche");
  const zoneResultats = document.getElementById("resultats-recherche");
  if (champRecherche && zoneResultats) {
    champRecherche.addEventListener("input", () => {
      const q = normaliser(champRecherche.value.trim());
      if (q.length < 2) { zoneResultats.innerHTML = ""; return; }
      const matches = BASE_ALIMENTS.filter((a) => normaliser(a.nom).includes(q)).slice(0, 6);
      zoneResultats.innerHTML = matches.length
        ? `<div class="resultats-liste">${matches.map((a) => `

function lireFichierPhoto(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Lecture impossible"));
    r.readAsDataURL(f);
  });
}

async function estimerViaService(image) {
  const url = getApiPhoto();
  if (!url) throw new Error("Aucun service configuré");
  const cle = getCleSecretePhoto();
  const headers = { "Content-Type": "application/json" };
  if (cle) headers["X-Cle"] = cle;
  const rep = await fetch(url, {
    method: "POST",
    headers,
    body: JSON.stringify({ image_base64: image.data, media_type: image.media }),
  });
  if (!rep.ok) throw new Error("HTTP " + rep.status);
  const data = await rep.json();
  if (!data || typeof data !== "object" || !("kcal" in data)) throw new Error("réponse inattendue");
  return data;
}

function ajouterEntree(item) {
  const maintenant = Date.now();
  state.entrees = [...state.entrees, { ...item, id: maintenant + Math.random(), t: maintenant }];
  setEntrees(state.date, state.entrees);
  render();
}

/* Horodatage du dernier aliment enregistré, en remontant jusqu'à 3 jours.
   Les anciennes entrées n'ont pas de champ "t" : leur "id" vaut Date.now() + aléa, on s'en sert. */
function dernierRepasTimestamp() {
  const aujourd = aujourdhui();
  let dernier = 0;
  for (let j = 0; j <= 3; j++) {
    const entrees = j === 0 ? state.entrees : getEntrees(dateMoins(aujourd, j));
    entrees.forEach((e) => {
      const t = Number(e.t) || Math.floor(Number(e.id)) || 0;
      if (t > 1000000000000 && t > dernier) dernier = t;
    });
    if (dernier) break;
  }
  return dernier;
}

function formatDuree(ms) {
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h > 0 ? `${h} h ${String(m).padStart(2, "0")}` : `${m} min`;
}

function texteJeune() {
  const dernier = dernierRepasTimestamp();
  if (!dernier) return null;
  const ecoule = Date.now() - dernier;
  if (ecoule < 0 || ecoule > 4 * 86400000) return null;
  const h = ecoule / 3600000;
  let etat, couleur;
  if (h < 4) { etat = "Fenêtre de repas ouverte"; couleur = "var(--abricot)"; }
  else if (h < 16) { etat = "Jeûne en cours"; couleur = "var(--bleu)"; }
  else if (h < 22) { etat = "Zone OMAD atteinte"; couleur = "var(--pistache)"; }
  else { etat = "Jeûne long — pense à manger"; couleur = "var(--brique)"; }
  return { duree: formatDuree(ecoule), etat, couleur, pct: Math.min(100, (h / 20) * 100) };
}

let minuteurJeune = null;
function lancerMinuteurJeune() {
  clearInterval(minuteurJeune);
  minuteurJeune = setInterval(() => {
    const el = document.getElementById("jeune-duree");
    if (!el) { clearInterval(minuteurJeune); return; }
    const j = texteJeune();
    if (j) el.textContent = j.duree;
  }, 30000);
}

try {
  render();
} catch (e) {
  afficherErreurFatale(e);
}
</script>
